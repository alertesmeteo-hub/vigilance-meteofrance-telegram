name: Vigilance quotidienne Telegram
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prévisualiser sans envoyer sur Telegram
        type: boolean
        default: true
  schedule:
    - cron: '*/5 * * * *'
      timezone: Europe/Paris
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m py_compile send_vigilance.py
  publication:
    needs: verification
    if: github.event_name == 'workflow_dispatch' || vars.VIGILANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - name: Publier ou prévisualiser
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@Alerte_meteo'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python send_vigilance.py
