name: Vigilance quotidienne Telegram

on:
  push:
    branches: [main]
    paths: ['send_vigilance.py', '.github/workflows/vigilance.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prévisualiser sans envoyer sur Telegram'
        type: boolean
        default: true
  schedule:
    - cron: '*/5 * * * *'
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: vigilance-telegram
  cancel-in-progress: false

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile send_vigilance.py

  publication:
    needs: verification
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.VIGILANCE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32.4,<3'
      - name: Prévisualiser la vigilance Météo-France
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@Alerte_meteo'
          DRY_RUN: 'true'
        run: python send_vigilance.py
      - name: Décider de la publication
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_hash=$(sha256sum output/message.html | awk '{print $1}')
          git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
          previous_hash=$(git show origin/state:vigilance.sha256 2>/dev/null || true)
          now=$(TZ=Europe/Paris date +%H%M)
          if [ "$current_hash" != "$previous_hash" ] || [ "$now" = "0605" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "hash=$current_hash" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier sur Telegram et mémoriser la version
        if: steps.decide.outputs.publish == 'true'
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@Alerte_meteo'
          DRY_RUN: 'false'
          MESSAGE_HASH: ${{ steps.decide.outputs.hash }}
        run: |
          python send_vigilance.py
          if git ls-remote --exit-code --heads origin state; then
            git fetch origin state:state
            git checkout state
          else
            git checkout --orphan state
            git rm -rf . || true
          fi
          printf '%s\n' "$MESSAGE_HASH" > vigilance.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vigilance.sha256
          git commit -m 'Mémorise la dernière vigilance publiée'
          git push origin state
      - name: Conserver la prévisualisation manuelle
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vigilance-${{ github.run_id }}
          path: output/
          retention-days: 7
